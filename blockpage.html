<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Blocked</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2125; --muted: #5e6670; --line: #e3e6ea;
    --accent: #c62828; --accent-bg: #fdecea; --chip: #eef1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181b; --card: #1f2327; --text: #e8eaed; --muted: #9aa3ad; --line: #30363c;
      --accent: #ff6b6b; --accent-bg: #3a2023; --chip: #2a2f34;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main {
    width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 28px; box-shadow: 0 2px 12px rgba(0, 0, 0, .06);
  }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    background: var(--accent-bg); color: var(--accent); font-size: 13px; font-weight: 600;
  }
  h1 { font-size: 22px; line-height: 1.3; margin: 14px 0 4px; word-break: break-all; }
  .reason { font-size: 17px; margin: 12px 0 18px; }
  .reason strong { color: var(--accent); }
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; word-break: break-word; }
  .chip { display: inline-block; background: var(--chip); border-radius: 6px; padding: 1px 7px; margin: 0 4px 4px 0; }
  .help { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .help p { margin: 0 0 8px; }
  code { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--chip); border-radius: 4px; padding: 1px 5px; }
  footer { margin-top: 14px; font-size: 12px; color: var(--muted); }
  @media (max-width: 420px) { main { padding: 20px; } dl { grid-template-columns: 1fr; gap: 2px; } dd { margin-bottom: 8px; } }
</style>
</head>
<body>
<main>
  <span class="badge">Blocked by this network</span>
  <h1 id="domain">This site is blocked</h1>
  <p class="reason" id="reason">It is on one of the network's block lists.</p>
  <dl id="details" hidden></dl>
  <div class="help">
    <p id="mistake">If this is a mistake, ask the network admin to add the site to the <strong>allow list</strong> in UniFi Network (Settings &rarr; CyberSecure &rarr; Content Filter).</p>
    <p id="admin" hidden>Admin: <code id="cmd"></code> on the gateway shows the details.</p>
  </div>
  <footer id="footer">unifi-blocklist</footer>
</main>
<script>
(function () {
  "use strict";
  var host = location.hostname.toLowerCase().replace(/\.$/, "");
  var $ = function (id) { return document.getElementById(id); };
  var isIp = /^[0-9.]+$/.test(host) || host.indexOf(":") >= 0;
  if (!host || isIp) return;  // opened by address, not by a blocked name

  document.title = "Blocked: " + host;
  $("domain").textContent = host;
  $("cmd").textContent = "blocklist.sh why " + host;
  $("admin").hidden = false;

  // The name and each parent with at least two labels; a list entry also covers its subdomains.
  var labels = host.split("."), names = [];
  for (var i = 0; i < labels.length - 1; i++) names.push(labels.slice(i).join("."));

  function get(path) {
    return fetch(path, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error(path + ": " + r.status);
      return r.text();
    });
  }
  // Same hash as build_blockpage in blocklist.sh.
  function shard(name, chars, n) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + chars.indexOf(name.charAt(i)) + 1) % n;
    return h;
  }
  function list(items) {
    if (items.length < 2) return items.join("");
    return items.slice(0, -1).join(", ") + " and " + items[items.length - 1];
  }
  function row(label, html) {
    var dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = label; dd.innerHTML = html;
    $("details").appendChild(dt); $("details").appendChild(dd);
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }
  function chips(items) { return items.map(function (s) { return '<span class="chip">' + esc(s) + "</span>"; }).join(""); }

  get("/__ub/meta.json").then(JSON.parse).then(function (meta) {
    $("footer").textContent = "unifi-blocklist · lists updated " + meta.updated;
    var shards = {};
    function lookup(k) {
      if (k >= names.length) return Promise.resolve(null);
      var name = names[k], s = shard(name, meta.chars, meta.shards);
      if (!(s in shards)) shards[s] = get("/__ub/i/" + s).catch(function () { return ""; });
      return shards[s].then(function (text) {
        var at = ("\n" + text).indexOf("\n" + name + "\t");
        if (at < 0) return lookup(k + 1);
        var line = text.slice(at, text.indexOf("\n", at) < 0 ? undefined : text.indexOf("\n", at));
        return { entry: name, ids: line.split("\t")[1].split(",") };
      });
    }
    return lookup(0).then(function (hit) {
      if (!hit) {
        $("reason").textContent = "It's blocked by the network's filter, but it isn't in any of the categories. "
          + "A UniFi setting may block it, or the lists have changed since.";
        return;
      }
      var groups = {}, order = [], sources = [], own = [];
      hit.ids.forEach(function (id) {
        var src = meta.sources[id] || { name: id, categories: [] };
        if (id === "ui") own.push("the UniFi block list");
        else if (id === "custom") own.push("the custom block list");
        else sources.push(src.name);
        src.categories.forEach(function (c) {
          if (!(c.group in groups)) { groups[c.group] = []; order.push(c.group); }
          if (groups[c.group].indexOf(c.name) < 0) groups[c.group].push(c.name);
        });
      });
      var parts = order.map(function (g) {
        var names = groups[g];
        return "the <strong>" + esc(list(names)) + "</strong> " + (names.length > 1 ? "categories" : "category") + " (" + esc(g) + ")";
      });
      var text = "";
      if (parts.length) text = "Blocked because it's in " + list(parts) + ".";
      if (own.length) text += (text ? " It is also on " : "Blocked because it's on ") + esc(list(own)) + ".";
      $("reason").innerHTML = text;
      if (hit.entry !== host) row("Matched entry", esc(hit.entry) + " (covers its subdomains)");
      if (sources.length) row(sources.length > 1 ? "Lists" : "List", chips(sources));
      $("details").hidden = $("details").children.length === 0;
    });
  }).catch(function () { /* keep the generic text */ });
})();
</script>
</body>
</html>
